# Zero-dependency in-memory demonstration profile (no Docker or external PostgreSQL required)
spring:
  datasource:
    url: jdbc:h2:mem:hireflow_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

hireflow:
  seed:
    enabled: true
  storage:
    upload-dir: ./data/uploads

logging:
  level:
    com.hireflow: INFO
    org.springframework.security: WARN
