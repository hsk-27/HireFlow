server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:hireflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

hireflow:
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      access-expiration-ms: 3600000
      refresh-expiration-ms: 86400000
    cors:
      allowed-origins: http://localhost:5173
  storage:
    upload-dir: ./target/test-uploads
    max-file-size: 10485760
  seed:
    enabled: false

logging:
  level:
    com.hireflow: INFO
